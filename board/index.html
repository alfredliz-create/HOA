<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winston 200 · Board Decisions</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231b2a41'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>W</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14213d;--mute:#64708a;--line:#e4e7ee;--navy:#1b2a41;--green:#18794e;--green-bg:#e4f4ec;--red:#b42318;--red-bg:#fbe9e7;--amber:#b54708;--amber-bg:#fff3e0;--blue:#1d4ed8;--blue-bg:#e8eefc;--grey-bg:#eceff3}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--blue)}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:10}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-weight:800;letter-spacing:-.01em;font-size:17px}.brand span{opacity:.6;font-weight:500;margin-left:8px;font-size:13px}
.me{font-size:13px;opacity:.85}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{color:#fff;text-decoration:none;padding:7px 13px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;opacity:.75}
nav a.on{background:#fff;color:var(--navy);opacity:1}
nav a .n{background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;margin-left:6px}
main{padding:20px 0 90px}
h1{font-size:24px;letter-spacing:-.02em;margin:6px 0 4px}h2{font-size:17px;margin:26px 0 10px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-size:13px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,33,61,.04)}
.card.click{cursor:pointer;transition:transform .08s,box-shadow .08s}.card.click:hover{box-shadow:0 4px 14px rgba(20,33,61,.08);transform:translateY(-1px)}
.t{font-size:18px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.meta{color:var(--mute);font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-open{background:var(--amber-bg);color:var(--amber)}.p-ok{background:var(--green-bg);color:var(--green)}.p-no{background:var(--red-bg);color:var(--red)}.p-grey{background:var(--grey-bg);color:var(--mute)}.p-blue{background:var(--blue-bg);color:var(--blue)}.p-red{background:var(--red);color:#fff}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;margin:14px 0}
.kv b{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding-top:3px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:#fff;padding:12px 14px;font-weight:700;font-size:16px;color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
.yes{background:var(--green);color:#fff;border-color:var(--green)}.no{background:var(--red);color:#fff;border-color:var(--red)}.info{background:#fff}
.btns .dim{opacity:.35}
.primary{background:var(--navy);color:#fff;border-color:var(--navy);width:100%;padding:15px;font-size:17px}
.sm{font-size:14px;padding:8px 12px;font-weight:600}.danger{color:var(--red)}
textarea,input,select{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
textarea{min-height:66px;resize:vertical}
label.l{display:block;font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:12px 0 4px}
.empty{text-align:center;padding:48px 20px;color:var(--mute)}.empty .big{font-size:40px;margin-bottom:6px}
.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}
.tally{display:flex;gap:16px;font-weight:700;margin:6px 0;flex-wrap:wrap}
.who{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.who span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:#fff}
.who .done{background:var(--green-bg);border-color:#bfe3c9}.who .wait{background:var(--amber-bg);border-color:#f3d9b1}
.reason{border-left:3px solid var(--line);padding:6px 12px;margin:8px 0;font-size:15px}.reason .n{font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:20;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.hide{display:none!important}
.src{background:#f8f9fb;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap;color:#3b4252;max-height:240px;overflow:auto}
.muted{color:var(--mute);font-size:14px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.banner{background:var(--blue-bg);border:1px solid #c9d7f8;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.banner.warn{background:var(--amber-bg);border-color:#f3d9b1}.banner.conf{background:var(--red-bg);border-color:#f3c9c6}
.flag{display:inline-flex;align-items:center;gap:6px;background:var(--amber-bg);color:var(--amber);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;margin:4px 6px 4px 0}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.kpi div{background:#f8f9fb;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi small{display:block;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi b{font-size:18px;letter-spacing:-.01em}.kpi .d{font-size:12px;font-weight:600;margin-left:4px}
.cmp{overflow-x:auto}.cmp table td:first-child{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.light{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}.g{background:var(--green)}.a{background:var(--amber)}.r{background:var(--red)}
.login{max-width:420px;margin:60px auto;text-align:center}
.login input{text-align:center;font-size:18px}
details summary{cursor:pointer;font-weight:600}
.prog{height:6px;background:var(--grey-bg);border-radius:999px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--green)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{padding:8px 12px;font-size:14px;border-radius:999px}.tabs .on{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (max-width:560px){.kv{grid-template-columns:1fr}.kv b{padding-top:6px}.btns{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap">
 <div class="top"><div class="brand">Winston Towers 200<span>Board Decisions</span></div><div class="me" id="me"></div></div>
 <nav id="nav">
  <a href="#home" data-v="home">For me</a>
  <a href="#board" data-v="board" class="mgr hide">Board view</a>
  <a href="#contracts" data-v="contracts">Contracts</a>
  <a href="#log" data-v="log">Log</a>
  <a href="#help" data-v="help">Help</a>
 </nav>
</div></header>
<main class="wrap" id="main"><div class="empty"><div class="big">…</div>Loading</div></main>
<div id="toast" class="toast hide"></div>

<script>
const SUPABASE_URL='https://phxkdyzomhdulbzwdula.supabase.co';
const SUPABASE_KEY='sb_publishable_jE74H9aJxU0MH9oZSYfFvQ_DZCo6CBZ';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});

const S={session:null,me:null,people:[],cards:[],progress:{},votes:[],comments:[],contracts:[],vendors:[],reports:[],settings:{},ready:false,picked:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'})).toISOString().slice(0,10);
const fmtD=d=>{if(!d)return'—';const x=new Date(d+'T12:00:00');return isNaN(x)?d:x.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};
const money=n=>n==null||n===''?'—':'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
const pct=n=>n==null?'—':(n>0?'+':'')+Number(n).toFixed(1)+'%';
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
function toast(m,ms=2800){const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.add('hide'),ms)}
const person=id=>S.people.find(p=>p.id===id);
const nameOf=id=>person(id)?.name||'Someone';
const role=()=>S.me?.role||'observer';
const isMgr=()=>['admin','president','manager'].includes(role());
const isAdmin=()=>role()==='admin';
const amVoter=()=>!!S.me?.is_voter;
const voters=()=>S.people.filter(p=>p.is_voter&&p.active);
const needed=()=>Math.floor((+S.settings.voters_count||voters().length||1)/2)+1;
const prog=id=>S.progress[id]||{voted:0,voters:voters().length,waiting_ids:voters().map(p=>p.id),voted_ids:[],needed:needed()};
const myVote=id=>S.votes.find(v=>v.card_id===id&&v.person_id===S.me?.id);
const isClosed=c=>c.status==='closed';
const isOpen=c=>c.status==='open';
const contractOf=id=>S.contracts.find(c=>c.id===id);
const vendorOf=id=>S.vendors.find(v=>v.id===id);

// ---------- auth ----------
async function boot(){
 const u=new URL(location.href);const tok=u.searchParams.get('t')||(location.hash.startsWith('#t=')?location.hash.slice(3):null);
 if(tok){history.replaceState(null,'',location.pathname);try{const r=await fetch(SUPABASE_URL+'/functions/v1/enter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok})});const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||'Sign-in failed');await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});toast('Welcome, '+(j.name||''))}catch(e){renderLogin(e.message)}}
 const {data:{session}}=await sb.auth.getSession();S.session=session;
 if(!session){renderLogin();return}
 await loadAll();subscribe();S.ready=true;render();
 sb.rpc('touch_seen').then(()=>{});
}
function renderLogin(err){S.ready=true;$('#main').innerHTML=`<div class="login card"><div style="font-size:40px">🔐</div><h1>Winston 200 Board</h1><p class="muted">Use the personal link from your invitation email — it signs you in automatically, no password.</p>${err?`<div class="banner warn">${esc(err)}</div>`:''}<p class="muted" style="margin-top:20px">Lost your link? Enter your board email and we'll send a 6-digit code.</p><input id="lg_email" type="email" placeholder="you@example.com" autocomplete="email"><div id="lg_step2" class="hide"><input id="lg_code" inputmode="numeric" placeholder="6-digit code" style="margin-top:8px"></div><button class="primary" style="margin-top:10px" id="lg_btn" onclick="loginStep()">Send me a code</button><p id="lg_msg" class="muted"></p></div>`}
async function loginStep(){const em=($('#lg_email').value||'').trim().toLowerCase();const code=($('#lg_code')?.value||'').trim();if(!em)return toast('Enter your email');
 if(!code){const {error}=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:true}});if(error)return $('#lg_msg').textContent=error.message;$('#lg_step2').classList.remove('hide');$('#lg_btn').textContent='Sign in';$('#lg_msg').textContent='Check your email for the code (it can take a minute).';return}
 const {error}=await sb.auth.verifyOtp({email:em,token:code,type:'email'});if(error)return $('#lg_msg').textContent=error.message;location.reload()}
async function logout(){await sb.auth.signOut();location.reload()}

// ---------- data ----------
async function loadAll(){
 const [pe,se,ca,pr,vo,co,ct,ve,re]=await Promise.all([
  sb.from('people').select('*').order('name'),sb.from('settings').select('*'),sb.from('cards').select('*').order('created_at',{ascending:false}),
  sb.from('card_progress').select('*'),sb.from('votes').select('*'),sb.from('comments').select('*').order('created_at'),
  sb.from('contracts').select('*').order('term_end'),sb.from('vendors').select('*').order('name'),sb.from('reports').select('id,title,source,received_at,report_date,from_email,file_name,status,extraction,processed_at').order('received_at',{ascending:false})]);
 S.people=pe.data||[];S.settings=Object.fromEntries((se.data||[]).map(r=>[r.key,r.value]));S.cards=ca.data||[];S.progress=Object.fromEntries((pr.data||[]).map(r=>[r.card_id,r]));S.votes=vo.data||[];S.comments=co.data||[];S.contracts=ct.data||[];S.vendors=ve.data||[];S.reports=re.data||[];
 const em=(S.session?.user?.email||'').toLowerCase();S.me=S.people.find(p=>p.email.toLowerCase()===em||(p.alt_emails||[]).map(x=>x.toLowerCase()).includes(em))||null;
 document.querySelectorAll('.mgr').forEach(e=>e.classList.toggle('hide',!isMgr()));
}
let refreshT=null;function subscribe(){sb.channel('all').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(refreshT);refreshT=setTimeout(async()=>{await loadAll();render()},400)}).subscribe()}
async function refresh(){await loadAll();render()}

// ---------- routing ----------
function view(){const h=(location.hash||'#home').slice(1);for(const k of ['card','contract','report'])if(h.startsWith(k+'-'))return{v:k,id:h.slice(k.length+1)};return{v:h||'home'}}
window.addEventListener('hashchange',render);const go=h=>location.hash=h;

// ---------- render ----------
function render(){if(!S.ready||!S.session)return;const {v,id}=view();
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v||(v==='card'&&a.dataset.v==='home')||(v==='contract'&&a.dataset.v==='contracts')||(v==='report'&&a.dataset.v==='board')));
 const mine=openCards().filter(c=>amVoter()&&!myVote(c.id));const n=$('nav a[data-v=home] .n');if(mine.length){if(n)n.textContent=mine.length;else{const s=document.createElement('span');s.className='n';s.textContent=mine.length;$('nav a[data-v=home]').appendChild(s)}}else n?.remove();
 $('#me').innerHTML=S.me?`${esc(S.me.name.split(' ')[0])} · ${esc(role())} · <a href="#" onclick="logout();return false" style="color:#fff;opacity:.7">sign out</a>`:'';
 const m=$('#main');const R={home:rHome,card:()=>rCard(id),board:rBoard,contracts:rContracts,contract:()=>rContract(id),log:rLog,report:()=>rReport(id),help:rHelp}[v]||rHome;
 m.innerHTML=R();window.scrollTo(0,0)}
const openCards=()=>S.cards.filter(isOpen);
function pill(c){const p=prog(c.id);if(c.status==='draft')return'<span class="pill p-grey">Draft · not sent</span>';if(isClosed(c))return c.result==='APPROVED'?'<span class="pill p-ok">Approved</span>':c.result==='DECLINED'?'<span class="pill p-no">Declined</span>':'<span class="pill p-grey">Not decided → meeting</span>';const over=c.deadline&&today()>c.deadline;return`<span class="pill p-open">Open · ${p.voted} of ${p.voters} voted · needs ${p.needed}</span>`+(over?'<span class="pill p-red">Overdue</span>':'')}
const kindPill=c=>({contract:'<span class="pill p-blue">Contract</span>',bid:'<span class="pill p-blue">Bids</span>',invoice:'<span class="pill p-blue">Invoice</span>',policy:'<span class="pill p-blue">Policy</span>'}[c.kind]||'');
function row(c,showMine){const mv=myVote(c.id);const fl=(c.flags||[]).length;return`<div class="card click" onclick="go('card-${c.id}')"><p class="t">${esc(c.title)}</p><div class="meta">${pill(c)}${kindPill(c)}${c.needs_open_meeting?'<span class="pill p-blue">Straw poll</span>':''}${c.confidential?'<span class="pill p-red">Confidential</span>':''}<span>Vote by ${fmtD(c.deadline)}</span>${c.cost_text?`<span>· ${esc(c.cost_text)}</span>`:''}${fl?`<span class="warn">· ⚠ ${fl} flag${fl>1?'s':''}</span>`:''}</div><div style="margin-top:6px">${esc(c.ask)}</div>${showMine&&mv?`<div class="muted" style="margin-top:6px">You voted <b>${mv.choice.toUpperCase()}</b> — change it any time before it closes.</div>`:''}</div>`}

function rHome(){if(!S.me)return`<div class="banner warn">Signed in as ${esc(S.session.user.email)}, but that address isn't on the board roster. Ask Alfred to add it.</div>`;
 const open=openCards();const mine=open.filter(c=>amVoter()&&!myVote(c.id));let h='';
 if(mine.length){const mins=Math.max(1,Math.round(mine.length*0.8));h+=`<h1>${mine.length} decision${mine.length>1?'s':''} waiting on you</h1><p class="sub">About ${mins} minute${mins>1?'s':''}. Tap one, choose Yes or No, say why in one line.</p>`+mine.map(c=>row(c)).join('')}
 else h+=`<div class="empty"><div class="big">✅</div><b>You're all caught up.</b><br>Nothing is waiting on you.</div>`;
 const others=open.filter(c=>!mine.includes(c));if(others.length)h+=`<h2>Other open decisions</h2>`+others.map(c=>row(c,true)).join('');
 const recent=S.cards.filter(isClosed).sort((a,b)=>(b.closed_at||'').localeCompare(a.closed_at||'')).slice(0,3);
 if(recent.length)h+=`<h2>Recently decided</h2>`+recent.map(c=>row(c)).join('')+`<p><a href="#log">Full decision log →</a></p>`;
 const exp=S.contracts.filter(c=>c.status==='active'&&c.term_end&&c.term_end<=addDays(90));if(exp.length)h+=`<h2>Contracts ending within 90 days</h2>`+exp.map(c=>`<div class="card click" onclick="go('contract-${c.id}')"><b>${esc(c.title)}</b> <span class="muted">· ends ${fmtD(c.term_end)} · ${money(c.annual_cost)}/yr${c.notice_days?` · ${c.notice_days}-day notice`:''}</span></div>`).join('');
 return h}

function kpiPanel(c){const cmp=c.comparison||{};const ct=contractOf(c.contract_id);let h='';
 if(cmp.previous||cmp.proposed){const P=cmp.previous||{},N=cmp.proposed||{};const keys=[...new Set([...Object.keys(P),...Object.keys(N)])];
  h+=`<div class="card"><p class="t">Contract KPIs — ${cmp.previous?'last term vs. proposed':'proposed'}</p><div class="kpi">${['annual_cost','total_value','term_months','increase_cap_pct','notice_days'].filter(k=>k in N||k in P).map(k=>{const v=N[k]??P[k];const d=(k in P&&k in N&&typeof P[k]==='number'&&typeof N[k]==='number'&&P[k])?((N[k]-P[k])/P[k]*100):null;const lbl={annual_cost:'Annual cost',total_value:'Total value',term_months:'Term (months)',increase_cap_pct:'Max increase/yr',notice_days:'Notice (days)'}[k];const val=k.includes('cost')||k.includes('value')?money(v):k.includes('pct')?(v==null?'—':v+'%'):v;return`<div><small>${lbl}</small><b>${val}</b>${d!=null?`<span class="d ${d>0?'bad':d<0?'ok':''}">${pct(d)}</span>`:''}</div>`}).join('')}</div>
  <div class="cmp"><table><tr><th></th>${cmp.previous?`<th>Last (${esc(P.label||'previous')})</th>`:''}<th>Proposed (${esc(N.label||'new')})</th><th>Change</th></tr>${keys.filter(k=>k!=='label').map(k=>{const p=P[k],n=N[k];const num=typeof p==='number'&&typeof n==='number';const d=num&&p?((n-p)/p*100):null;return`<tr><td>${esc(k.replace(/_/g,' '))}</td>${cmp.previous?`<td>${esc(fmtKpi(k,p))}</td>`:''}<td>${esc(fmtKpi(k,n))}</td><td class="${d>0?'bad':d<0?'ok':''}">${d!=null?pct(d):(p!==undefined&&n!==undefined&&p!==n?'changed':'')}</td></tr>`}).join('')}</table></div>${ct?`<p class="muted" style="margin-top:8px"><a href="#contract-${ct.id}">Open the contract record →</a></p>`:''}</div>`}
 if(cmp.bids?.length){const hib=!!cmp.higher_is_better;h+=`<div class="card"><p class="t">${hib?'Offers side by side (income to the association)':'Bids side by side'}</p><div class="cmp"><table><tr><th>${hib?'Offer':'Bidder'}</th><th>${hib?'Income/yr':'Price'}</th><th>vs. best</th><th>Terms</th><th>Notes</th></tr>${cmp.bids.map((b,i,arr)=>{const nums=arr.map(x=>+x.price).filter(x=>x>0);const best=hib?Math.max(...nums):Math.min(...nums);const d=b.price&&best?((b.price-best)/best*100):null;const worse=hib?d<0:d>0;return`<tr><td><b>${esc(b.name)}</b></td><td>${money(b.price)}</td><td class="${worse?'bad':'ok'}">${d==null?'—':d===0?'best':pct(d)}</td><td>${esc(b.terms||'')}</td><td>${esc(b.notes||'')}</td></tr>`}).join('')}</table></div>${cmp.reserve_line?`<p class="muted" style="margin-top:8px">Reserve study line: <b>${esc(cmp.reserve_line.name)}</b> budgeted ${money(cmp.reserve_line.amount)}${cmp.reserve_line.year?` (${esc(cmp.reserve_line.year)})`:''}.</p>`:''}</div>`}
 else if(cmp.reserve_line){h+=`<div class="card"><p class="t">Against the reserve study</p><div class="kpi"><div><small>Budget line</small><b>${money(cmp.reserve_line.amount)}</b></div><div><small>Proposed</small><b>${money(c.amount)}</b>${c.amount&&cmp.reserve_line.amount?`<span class="d ${c.amount>cmp.reserve_line.amount?'bad':'ok'}">${pct((c.amount-cmp.reserve_line.amount)/cmp.reserve_line.amount*100)}</span>`:''}</div></div><p class="muted">${esc(cmp.reserve_line.name)}${cmp.reserve_line.year?` · planned ${esc(cmp.reserve_line.year)}`:''}</p></div>`}
 if(cmp.last_invoice){h+=`<div class="card"><p class="t">Against the last invoice</p><div class="kpi"><div><small>Last (${esc(cmp.last_invoice.date||'')})</small><b>${money(cmp.last_invoice.amount)}</b></div><div><small>This one</small><b>${money(c.amount)}</b>${c.amount&&cmp.last_invoice.amount?`<span class="d ${c.amount>cmp.last_invoice.amount?'bad':'ok'}">${pct((c.amount-cmp.last_invoice.amount)/cmp.last_invoice.amount*100)}</span>`:''}</div></div></div>`}
 return h}
const fmtKpi=(k,v)=>v==null?'—':(/cost|value|price|amount/.test(k)&&typeof v==='number')?money(v):(/pct/.test(k)&&typeof v==='number')?v+'%':typeof v==='boolean'?(v?'yes':'no'):String(v);

function rCard(id){const c=S.cards.find(x=>x.id===id);if(!c)return`<div class="empty">That decision isn't available.</div>`;const p=prog(id);const mv=myVote(id);const cmts=S.comments.filter(x=>x.card_id===id);const rep=S.reports.find(r=>r.id===c.report_id);const over=c.deadline&&today()>c.deadline&&isOpen(c);

 ${(c.flags||[]).length?`<div>${c.flags.map(f=>`<span class="flag">⚠ ${esc(f)}</span>`).join('')}</div>`:''}

 ${c.source_excerpt?`<details><summary class="muted">Show the lines from the report</summary><div class="src">${esc(c.source_excerpt)}</div></details>`:''}</div>`;
 h+=kpiPanel(c);
 if(isOpen(c)){if(amVoter()){h+=`<div class="card"><p class="t">${mv?'Your vote (tap to change)':'Your vote'}</p><div class="btns"><button class="yes ${mv&&mv.choice!=='yes'?'dim':''}" onclick="pick('yes')">YES</button><button class="no ${mv&&mv.choice!=='no'?'dim':''}" onclick="pick('no')">NO</button><button class="info ${mv&&mv.choice!=='info'?'dim':''}" onclick="pick('info')">I NEED MORE INFO</button></div><label class="l">Why? (one line, required)</label><textarea id="reason" placeholder="e.g. Lowest bid, and the vendor already knows our boilers.">${esc(mv?.reason||'')}</textarea><div id="pickState" class="muted" style="margin:6px 0">${mv?`Current: ${mv.choice.toUpperCase()}`:'Choose Yes, No or Need info above.'}</div><button class="primary" onclick="submitVote('${id}')">Save my vote</button></div>`}
  else if(S.me)h+=`<div class="banner">You can see this decision but you're not a voting director${isMgr()?' (manager view)':''}.</div>`;
  h+=`<div class="card"><p class="t">Where it stands</p><div class="prog"><i style="width:${Math.min(100,p.voted/Math.max(1,p.voters)*100)}%"></i></div><div class="muted">${p.voted} of ${p.voters} have voted · ${p.needed} needed to decide</div><div class="who">${voters().map(v=>`<span class="${p.voted_ids.includes(v.id)?'done':'wait'}">${esc(v.name.split(' ')[0])}${p.voted_ids.includes(v.id)?' ✓':''}</span>`).join('')}</div><p class="muted">How each person voted is sealed until the decision closes (majority or deadline). Then everyone sees the votes and reasons, with names.</p></div>`}
 else if(isClosed(c)){const vs=S.votes.filter(v=>v.card_id===id);const yes=vs.filter(v=>v.choice==='yes'),no=vs.filter(v=>v.choice==='no'),info=vs.filter(v=>v.choice==='info');const waiting=voters().filter(v=>!vs.some(x=>x.person_id===v.id));
  h+=`<div class="card"><p class="t">Result: ${c.result}</p><div class="tally"><span class="ok">${yes.length} yes</span><span class="bad">${no.length} no</span>${info.length?`<span class="warn">${info.length} need info</span>`:''}<span class="muted">of ${p.voters}${c.closed_reason==='deadline'?' · closed at deadline':''}</span></div>${vs.map(v=>`<div class="reason"><span class="n">${esc(nameOf(v.person_id))} — ${v.choice.toUpperCase()}</span><br>${esc(v.reason)}</div>`).join('')}${waiting.length?`<p class="muted">Did not vote: ${esc(waiting.map(v=>v.name).join(', '))}</p>`:''}<label class="l">Summary everyone receives</label><div class="src" id="sum">${esc(summaryText(c))}</div><div class="inline" style="margin-top:8px"><button class="sm" onclick="copyText(document.getElementById('sum').textContent)">Copy summary</button>${c.result==='NOT DECIDED'||c.needs_open_meeting?'<span class="pill p-blue">On next open-meeting agenda</span>':''}</div></div>`}
 h+=`<div class="card"><p class="t">Questions & notes</p>${cmts.length?cmts.map(x=>`<div class="reason"><span class="n">${esc(nameOf(x.person_id))}${x.is_counsel?' · Counsel note':''}</span> <span class="muted">${esc(x.created_at.slice(0,10))}</span><br>${esc(x.text)}</div>`).join(''):'<p class="muted">No questions yet. "I need more info" posts your question here for the manager.</p>'}${S.me?`<textarea id="cmt" placeholder="Ask the manager a question or add a short note…"></textarea><div class="inline" style="margin-top:8px"><button class="sm" onclick="addComment('${id}')">Post</button>${['attorney','observer'].includes(role())?'<label class="muted"><input type="checkbox" id="counsel" style="width:auto"> Counsel note</label>':''}</div>`:''}</div>`;
 if(isMgr())h+=mgrTools(c);
 return h}
function mgrTools(c){const cmp=c.comparison||{};return`<details class="card"><summary>Manager / president tools</summary>${c.status==='draft'?'<p class="muted">Draft — review, then send to the board.</p>':''}
 <label class="l">Title</label><input id="e_title" value="${esc(c.title)}"><label class="l">Kind</label><select id="e_kind">${['decision','contract','bid','invoice','policy'].map(k=>`<option ${c.kind===k?'selected':''}>${k}</option>`).join('')}</select><label class="l">The ask</label><textarea id="e_ask">${esc(c.ask)}</textarea><label class="l">Why it matters</label><textarea id="e_why">${esc(c.why||'')}</textarea><label class="l">Cost (text)</label><input id="e_cost" value="${esc(c.cost_text||'')}"><label class="l">Amount (number, for comparisons)</label><input id="e_amount" type="number" step="0.01" value="${c.amount??''}"><label class="l">Options (one per line)</label><textarea id="e_opts">${esc((c.options||[]).join('\n'))}</textarea><label class="l">Manager recommends</label><input id="e_rec" value="${esc(c.recommendation||'')}"><label class="l">Vote by</label><input id="e_dl" type="date" value="${esc(c.deadline||'')}"><label class="l">Manager to-do if approved</label><input id="e_todo" value="${esc(c.todo||'')}"><label class="l">Linked contract</label><select id="e_ct"><option value="">— none —</option>${S.contracts.map(x=>`<option value="${x.id}" ${c.contract_id===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><label class="l">Flags (one per line)</label><textarea id="e_flags">${esc((c.flags||[]).join('\n'))}</textarea><label class="l">Comparison (JSON — previous / proposed / bids / reserve_line / last_invoice)</label><textarea id="e_cmp" style="font-family:monospace;font-size:13px;min-height:120px">${esc(JSON.stringify(cmp,null,1))}</textarea>
 <div class="inline" style="margin:12px 0"><label><input type="checkbox" id="e_om" style="width:auto" ${c.needs_open_meeting?'checked':''}> Needs open-meeting vote (straw poll)</label><label><input type="checkbox" id="e_conf" style="width:auto" ${c.confidential?'checked':''}> Confidential</label></div>
 <div class="inline"><button class="sm" onclick="saveCard('${c.id}')">Save</button>${c.status==='draft'?`<button class="sm yes" onclick="sendCard('${c.id}')">Send to board</button><button class="sm" onclick="delCard('${c.id}')">Not a decision — remove</button>`:''}${isOpen(c)?`<button class="sm" onclick="closeCard('${c.id}')">Close now (not decided → agenda)</button>`:''}${isClosed(c)?`<button class="sm" onclick="reopen('${c.id}')">Reopen +5 days</button>`:''}${c.status!=='draft'?`<button class="sm danger" onclick="delCard('${c.id}')">Delete</button>`:''}</div></details>`}

function summaryText(c){const vs=S.votes.filter(v=>v.card_id===c.id);const y=vs.filter(v=>v.choice==='yes'),n=vs.filter(v=>v.choice==='no'),i=vs.filter(v=>v.choice==='info');const waiting=voters().filter(v=>!vs.some(x=>x.person_id===v.id)).map(v=>v.name);const N=+S.settings.voters_count||voters().length;
 return`Decision: ${c.title} — ${c.result||'OPEN'} (${y.length} yes / ${n.length} no${i.length?` / ${i.length} need info`:''} of ${N}).${(c.options||[]).length?` Options: ${c.options.join(' / ')}.`:''}${y.length?` For — ${y.map(v=>`${nameOf(v.person_id)}: ${v.reason}`).join('; ')}.`:''}${n.length?` Against — ${n.map(v=>`${nameOf(v.person_id)}: ${v.reason}`).join('; ')}.`:''}${waiting.length?` Did not vote: ${waiting.join(', ')}.`:''}${c.needs_open_meeting?' Straw poll only — binding vote at the next open meeting.':''}${c.result==='APPROVED'&&c.todo?` Manager to-do: ${c.todo}`:''}`}

 const drafts=S.cards.filter(c=>c.status==='draft');const open=openCards();const pending=S.reports.filter(r=>r.status==='pending');
 let h=`<h1>Board view</h1><p class="sub">Reports come in from John's emails automatically; Claude drafts the cards; you press Send.</p>`;
 if(pending.length)h+=`<div class="banner">${pending.length} report${pending.length>1?'s':''} waiting to be read by Claude (next pass runs hourly): ${pending.map(r=>esc(r.title)).join(', ')}.</div>`;
 h+=`<div class="card"><p class="t">Add a report or document by hand</p><p class="muted">Paste the text of a weekly update, proposal or invoice. Claude reads it on the next pass and drafts decision cards with comparisons.</p><label class="l">Title</label><input id="r_title" placeholder="Weekly Update 11.3.26"><label class="l">Date</label><input id="r_date" type="date" value="${today()}"><label class="l">Text</label><textarea id="r_text" style="min-height:120px" placeholder="Paste here…"></textarea><button class="primary" style="margin-top:10px" onclick="addReport()">Add report for Claude to read</button></div>`;
 if(drafts.length)h+=`<h2>Drafts to review (${drafts.length})</h2><div class="banner">Open each, fix anything, then "Send to board" — or send all at once.</div>`+drafts.map(c=>row(c)).join('')+`<button class="primary" onclick="sendAll()">Send all ${drafts.length} drafts to the board</button>`;

 h+=`<div class="card"><p class="t">Add a decision by hand</p><label class="l">Title</label><input id="n_title" placeholder="Approve the snow removal contract?"><label class="l">The ask</label><textarea id="n_ask"></textarea><label class="l">Cost</label><input id="n_cost"><label class="l">Options (one per line)</label><textarea id="n_opts"></textarea><label class="l">Vote by</label><input type="date" id="n_dl" value="${addDays(+S.settings.default_deadline_days||5)}"><div class="inline" style="margin:10px 0"><label><input type="checkbox" id="n_om" style="width:auto"> Needs open-meeting vote</label><label><input type="checkbox" id="n_conf" style="width:auto"> Confidential</label></div><button class="primary" onclick="addManual()">Create draft</button></div>`;
 const agenda=S.cards.filter(c=>c.status!=='draft'&&(c.needs_open_meeting||c.result==='NOT DECIDED'));

 ${isAdmin()?`<div class="inline" style="margin-top:10px"><input id="p_name" placeholder="Name" style="flex:1"><input id="p_email" placeholder="email" style="flex:1"><select id="p_role" style="width:auto">${['director','president','manager','attorney','observer','admin'].map(r=>`<option>${r}</option>`).join('')}</select><label><input type="checkbox" id="p_voter" checked style="width:auto"> votes</label><button class="sm" onclick="addPerson()">Add</button></div><div class="inline" style="margin-top:14px"><label>Voting directors: <input id="s_n" type="number" value="${S.settings.voters_count||7}" style="width:70px"></label><span class="muted">majority = ${needed()}</span><button class="sm" onclick="saveSettings()">Save</button></div><div id="linkbox"></div>`:''}</div>`;
 h+=`<h2>Export</h2><div class="card inline"><button class="sm" onclick="exportCSV()">Decision log (CSV)</button><button class="sm" onclick="copyText(digestText())">Copy weekly digest</button></div>`;
 return h}

function rContracts(){const act=S.contracts.filter(c=>c.status==='active'),prop=S.contracts.filter(c=>c.status==='proposed'),old=S.contracts.filter(c=>!['active','proposed'].includes(c.status));
 const rowC=c=>{const v=vendorOf(c.vendor_id);const days=c.term_end?Math.round((new Date(c.term_end)-new Date(today()))/864e5):null;const coi=c.coi_expires?(c.coi_expires<today()?'<span class="pill p-red">COI expired</span>':c.coi_expires<=addDays(60)?'<span class="pill p-open">COI expiring</span>':'<span class="pill p-ok">COI ok</span>'):(c.coi_on_file?'<span class="pill p-ok">COI on file</span>':'<span class="pill p-grey">No COI</span>');

 return`<h1>Contracts</h1><p class="sub">Every vendor agreement with its KPIs. When a renewal or replacement comes up, the decision card compares it to the row here.</p>${isMgr()?`<button class="sm" onclick="go('contract-new')">+ Add contract</button>`:''}<h2>Active (${act.length})</h2>${act.map(rowC).join('')||'<p class="muted">None recorded yet.</p>'}${prop.length?`<h2>Proposed (${prop.length})</h2>${prop.map(rowC).join('')}`:''}${old.length?`<h2>Past (${old.length})</h2>${old.map(rowC).join('')}`:''}`}

function rContract(id){const isNew=id==='new';const c=isNew?{kpis:{},status:'active'}:S.contracts.find(x=>x.id===id);if(!c)return'<div class="empty">Contract not found.</div>';const v=vendorOf(c.vendor_id);const cards=S.cards.filter(x=>x.contract_id===c.id);const prev=c.previous_contract_id?contractOf(c.previous_contract_id):null;const next=S.contracts.find(x=>x.previous_contract_id===c.id);
 let h=`<p><a href="#contracts">← Contracts</a></p>`;
 if(!isNew){h+=`<div class="card"><div class="meta"><span class="pill ${c.status==='active'?'p-ok':c.status==='proposed'?'p-open':'p-grey'}">${esc(c.status)}</span>${c.category?`<span class="pill p-blue">${esc(c.category)}</span>`:''}</div><h1 style="margin-top:8px">${esc(c.title)}</h1><p class="muted">${esc(v?.name||'')}${v?.contact?` · ${esc(v.contact)}`:''}</p>
 <div class="kpi"><div><small>Annual cost</small><b>${money(c.annual_cost)}</b>${prev?.annual_cost&&c.annual_cost?`<span class="d ${c.annual_cost>prev.annual_cost?'bad':'ok'}">${pct((c.annual_cost-prev.annual_cost)/prev.annual_cost*100)}</span>`:''}</div><div><small>Total value</small><b>${money(c.total_value)}</b></div><div><small>Term</small><b>${c.term_months?c.term_months+' mo':'—'}</b></div><div><small>Ends</small><b>${fmtD(c.term_end)}</b></div><div><small>Max increase</small><b>${c.increase_cap_pct!=null?c.increase_cap_pct+'%/yr':'—'}</b></div><div><small>Notice</small><b>${c.notice_days!=null?c.notice_days+' days':'—'}</b></div><div><small>Auto-renew</small><b>${c.auto_renew==null?'—':c.auto_renew?'Yes':'No'}</b></div><div><small>COI</small><b>${c.coi_expires?fmtD(c.coi_expires):c.coi_on_file?'On file':'None'}</b></div></div>
 ${Object.keys(c.kpis||{}).length?`<div class="cmp"><table>${Object.entries(c.kpis).map(([k,val])=>`<tr><td>${esc(k.replace(/_/g,' '))}</td><td>${esc(fmtKpi(k,val))}</td>${prev?.kpis?.[k]!==undefined?`<td class="muted">last: ${esc(fmtKpi(k,prev.kpis[k]))}</td>`:''}</tr>`).join('')}</table></div>`:''}
 ${c.notes?`<p style="margin-top:10px">${esc(c.notes)}</p>`:''}${c.doc_ref?`<p class="muted">Document: ${esc(c.doc_ref)}</p>`:''}
 ${prev?`<p class="muted">Replaced: <a href="#contract-${prev.id}">${esc(prev.title)}</a></p>`:''}${next?`<p class="muted">Replaced by: <a href="#contract-${next.id}">${esc(next.title)}</a></p>`:''}</div>`;
 if(cards.length)h+=`<h2>Decisions about this contract</h2>`+cards.map(x=>row(x)).join('')}
 if(isMgr())h+=`<details class="card" ${isNew?'open':''}><summary>${isNew?'New contract':'Edit contract'}</summary><label class="l">Title</label><input id="c_title" value="${esc(c.title||'')}"><label class="l">Vendor</label><div class="inline"><select id="c_vendor" style="flex:1"><option value="">— pick —</option>${S.vendors.map(x=>`<option value="${x.id}" ${c.vendor_id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><input id="c_newvendor" placeholder="or new vendor name" style="flex:1"></div><label class="l">Category</label><input id="c_cat" value="${esc(c.category||'')}" placeholder="laundry, elevator, snow…"><label class="l">Status</label><select id="c_status">${['proposed','active','expired','terminated','declined'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select><div class="inline"><div style="flex:1"><label class="l">Start</label><input id="c_start" type="date" value="${esc(c.term_start||'')}"></div><div style="flex:1"><label class="l">End</label><input id="c_end" type="date" value="${esc(c.term_end||'')}"></div><div style="flex:1"><label class="l">Months</label><input id="c_months" type="number" value="${c.term_months??''}"></div></div><div class="inline"><div style="flex:1"><label class="l">Annual cost</label><input id="c_annual" type="number" step="0.01" value="${c.annual_cost??''}"></div><div style="flex:1"><label class="l">Total value</label><input id="c_total" type="number" step="0.01" value="${c.total_value??''}"></div></div><div class="inline"><div style="flex:1"><label class="l">Max increase %/yr</label><input id="c_cap" type="number" step="0.1" value="${c.increase_cap_pct??''}"></div><div style="flex:1"><label class="l">Notice days</label><input id="c_notice" type="number" value="${c.notice_days??''}"></div><div style="flex:1"><label class="l">COI expires</label><input id="c_coi" type="date" value="${esc(c.coi_expires||'')}"></div></div><div class="inline" style="margin-top:10px"><label><input type="checkbox" id="c_auto" style="width:auto" ${c.auto_renew?'checked':''}> Auto-renews</label><label><input type="checkbox" id="c_coion" style="width:auto" ${c.coi_on_file?'checked':''}> COI on file</label></div><label class="l">Replaces (previous contract)</label><select id="c_prev"><option value="">— none —</option>${S.contracts.filter(x=>x.id!==c.id).map(x=>`<option value="${x.id}" ${c.previous_contract_id===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><label class="l">Other KPIs (JSON, e.g. {"revenue_share_pct":60,"machines":24})</label><textarea id="c_kpis" style="font-family:monospace;font-size:13px">${esc(JSON.stringify(c.kpis||{},null,1))}</textarea><label class="l">Document reference</label><input id="c_doc" value="${esc(c.doc_ref||'')}"><label class="l">Notes</label><textarea id="c_notes">${esc(c.notes||'')}</textarea><div class="inline" style="margin-top:10px"><button class="sm" onclick="saveContract('${isNew?'':c.id}')">Save</button>${!isNew?`<button class="sm danger" onclick="delContract('${c.id}')">Delete</button>`:''}</div></details>`;
 return h}

function rReport(id){const r=S.reports.find(x=>x.id===id);if(!r)return'<div class="empty">Report not found.</div>';const cards=S.cards.filter(c=>c.report_id===id);const ex=r.extraction||{};const sec=(t,arr,cls='')=>arr?.length?`<h2>${t}</h2><div class="card ${cls}"><ul style="margin:0;padding-left:20px">${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'';
 return`<p><a href="#board">← Board view</a></p><h1>${esc(r.title)}</h1><p class="sub">${fmtD(r.report_date||r.received_at?.slice(0,10))} · ${esc(r.source)}${r.from_email?` · from ${esc(r.from_email)}`:''} · ${r.status}</p><h2>Decision cards (${cards.length})</h2>${cards.map(c=>row(c)).join('')||'<p class="muted">None.</p>'}${sec('Money',ex.money)}${sec('Dates & deadlines',ex.dates)}${sec('FYI / progress — no action needed',ex.fyi)}${(amVoter()||isMgr())?sec('Confidential — board only',ex.sensitive,'conf'):''}${sec('Manager to-dos noted',ex.todos)}${isMgr()?`<details><summary class="muted">Full text</summary><div class="src" id="rtxt" style="max-height:500px">Loading…</div></details>${(setTimeout(()=>sb.from('reports').select('raw_text').eq('id',id).single().then(r=>{const e=document.getElementById('rtxt');if(e)e.textContent=r.data?.raw_text||'(no text stored)'}),50),'')}`:''}`}

function rLog(){const q=($('#logq')?.value||'').toLowerCase();const cards=S.cards.filter(c=>c.status!=='draft').sort((a,b)=>(b.closed_at||b.deadline||'').localeCompare(a.closed_at||a.deadline||''));const list=cards.filter(c=>!q||JSON.stringify(c).toLowerCase().includes(q));
 return`<h1>Decision log</h1><input id="logq" placeholder="Search decisions…" oninput="render()" value="${esc(q)}" style="margin-bottom:12px"><p class="muted">${list.length} decision${list.length!==1?'s':''}. Every vote, reason and source stays here.</p>`+(list.map(c=>row(c)).join('')||'<div class="empty">Nothing yet.</div>')}

function rHelp(){const N=+S.settings.voters_count||7;return`<h1>How this works</h1><div class="card"><p><b>1.</b> John emails his weekly update and proposals as usual. They land here automatically.</p><p><b>2.</b> Claude reads them and drafts one card per decision: the ask, why, cost, options, deadline — plus KPIs and a side-by-side when it's a contract, bids, or an invoice compared with the last one. The manager or president checks the drafts and presses <b>Send to board</b>.</p><p><b>3.</b> You get one email: "N decisions are waiting on you." Open your link, tap <b>YES</b>, <b>NO</b> or <b>I NEED MORE INFO</b>, type one line of why, save. That's it.</p><p><b>4.</b> A decision closes when <b>${needed()} of ${N}</b> directors agree, or at the deadline. Until then nobody — not even the admin — can see how anyone voted; the database itself enforces it.</p><p><b>5.</b> When it closes, everyone gets the same one-paragraph summary with the votes and the reasons, and it's logged forever.</p><p><b>6.</b> Every morning, anyone who hasn't voted gets one reminder listing only what's waiting on them.</p><p><b>7.</b> Anything marked <span class="pill p-blue">Straw poll</span> (contracts, capital projects, bylaw items) still gets its binding vote at the open meeting — the card tells the president where the board stands and auto-adds it to the agenda.</p><p><b>Lost your link?</b> Sign out and use "Send me a code" with your board email.</p></div>`}

// ---------- actions ----------
function pick(ch){S.picked=ch;document.querySelectorAll('.btns button').forEach(b=>b.classList.add('dim'));document.querySelector(`.btns .${ch}`).classList.remove('dim');$('#pickState').textContent='Chosen: '+ch.toUpperCase()+' — now say why and save.'}
async function submitVote(id){const ch=S.picked||myVote(id)?.choice;const reason=($('#reason').value||'').trim();if(!ch)return toast('Choose Yes, No or Need info first');if(reason.length<2)return toast('Please say why — one line is enough');
 const {error}=await sb.rpc('cast_vote',{p_card:id,p_choice:ch,p_reason:reason});if(error)return toast(error.message);S.picked=null;if(ch==='info')await sb.from('comments').insert({card_id:id,person_id:S.me.id,text:'Needs more info: '+reason});toast('Vote saved');await refresh();go('home')}
async function addComment(id){const t=($('#cmt').value||'').trim();if(!t)return;const {error}=await sb.from('comments').insert({card_id:id,person_id:S.me.id,text:t,is_counsel:!!$('#counsel')?.checked});if(error)return toast(error.message);toast('Posted');refresh()}
function readCardForm(){let cmp={};try{cmp=JSON.parse($('#e_cmp').value||'{}')}catch(e){toast('Comparison JSON is not valid');throw e}return{title:$('#e_title').value.trim(),kind:$('#e_kind').value,ask:$('#e_ask').value.trim(),why:$('#e_why').value.trim(),cost_text:$('#e_cost').value.trim(),amount:$('#e_amount').value===''?null:+$('#e_amount').value,options:$('#e_opts').value.split('\n').map(s=>s.trim()).filter(Boolean),recommendation:$('#e_rec').value.trim(),deadline:$('#e_dl').value||null,todo:$('#e_todo').value.trim(),contract_id:$('#e_ct').value||null,flags:$('#e_flags').value.split('\n').map(s=>s.trim()).filter(Boolean),comparison:cmp,needs_open_meeting:$('#e_om').checked,confidential:$('#e_conf').checked}}
async function saveCard(id){const d=readCardForm();const {error}=await sb.from('cards').update(d).eq('id',id);if(error)return toast(error.message);toast('Saved');refresh()}
async function sendCard(id){const d=readCardForm();if(!d.deadline)return toast('Set a deadline first');if(!d.title||!d.ask)return toast('Title and ask are required');const {error}=await sb.from('cards').update({...d,status:'open',sent_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message);toast('Sent to the board');await refresh();go('board')}
async function sendAll(){const ds=S.cards.filter(c=>c.status==='draft');for(const c of ds){await sb.from('cards').update({status:'open',sent_at:new Date().toISOString(),deadline:c.deadline||addDays(+S.settings.default_deadline_days||5)}).eq('id',c.id)}toast(`Sent ${ds.length}`);refresh()}
async function closeCard(id){await sb.from('cards').update({status:'closed',result:'NOT DECIDED',closed_at:new Date().toISOString(),closed_reason:'manual'}).eq('id',id);toast('Closed — on the agenda');refresh()}
async function reopen(id){await sb.from('cards').update({status:'open',result:null,closed_at:null,closed_reason:null,deadline:addDays(5)}).eq('id',id);toast('Reopened');refresh()}
async function delCard(id){const {error}=await sb.from('cards').delete().eq('id',id);if(error)return toast(error.message);toast('Removed');await refresh();go('board')}
async function addManual(){const d={title:$('#n_title').value.trim(),ask:$('#n_ask').value.trim(),cost_text:$('#n_cost').value.trim(),options:$('#n_opts').value.split('\n').map(s=>s.trim()).filter(Boolean),deadline:$('#n_dl').value||null,needs_open_meeting:$('#n_om').checked,confidential:$('#n_conf').checked,status:'draft',created_by:S.me.id};if(!d.title||!d.ask)return toast('Title and ask are required');const {data,error}=await sb.from('cards').insert(d).select().single();if(error)return toast(error.message);await refresh();go('card-'+data.id)}
async function addReport(){const d={title:$('#r_title').value.trim()||'Report '+today(),report_date:$('#r_date').value||null,raw_text:$('#r_text').value.trim(),source:'upload',status:'pending',uploaded_by:S.me.id};if(!d.raw_text)return toast('Paste the text first');const {error}=await sb.from('reports').insert(d);if(error)return toast(error.message);toast('Added — Claude reads it on the next pass');refresh()}
async function addPerson(){const d={name:$('#p_name').value.trim(),email:$('#p_email').value.trim().toLowerCase(),role:$('#p_role').value,is_voter:$('#p_voter').checked};if(!d.name||!d.email)return toast('Name and email required');const {error}=await sb.from('people').insert(d);if(error)return toast(error.message);refresh()}
async function togglePerson(id){const p=person(id);await sb.from('people').update({active:!p.active}).eq('id',id);refresh()}
async function saveSettings(){await sb.from('settings').upsert({key:'voters_count',value:+$('#s_n').value||7});toast('Saved');refresh()}
async function newLink(id){const tok=[...crypto.getRandomValues(new Uint8Array(24))].map(b=>('0'+b.toString(16)).slice(-2)).join('');const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(tok));const hash=[...new Uint8Array(buf)].map(b=>('0'+b.toString(16)).slice(-2)).join('');const {error}=await sb.from('people').update({login_token_hash:hash}).eq('id',id);if(error)return toast(error.message);const link=location.origin+location.pathname+'?t='+tok;$('#linkbox').innerHTML=`<div class="banner" style="margin-top:12px"><b>Personal link for ${esc(nameOf(id))}</b> (shown once — send it to them):<br><input value="${esc(link)}" readonly onclick="this.select()"><button class="sm" style="margin-top:6px" onclick="copyText('${link}')">Copy link</button></div>`}
async function saveContract(id){let kpis={};try{kpis=JSON.parse($('#c_kpis').value||'{}')}catch(e){return toast('KPI JSON is not valid')}let vendor_id=$('#c_vendor').value||null;const nv=$('#c_newvendor').value.trim();if(nv){const {data,error}=await sb.from('vendors').insert({name:nv}).select().single();if(error)return toast(error.message);vendor_id=data.id}
 const d={title:$('#c_title').value.trim(),vendor_id,category:$('#c_cat').value.trim()||null,status:$('#c_status').value,term_start:$('#c_start').value||null,term_end:$('#c_end').value||null,term_months:$('#c_months').value===''?null:+$('#c_months').value,annual_cost:$('#c_annual').value===''?null:+$('#c_annual').value,total_value:$('#c_total').value===''?null:+$('#c_total').value,increase_cap_pct:$('#c_cap').value===''?null:+$('#c_cap').value,notice_days:$('#c_notice').value===''?null:+$('#c_notice').value,coi_expires:$('#c_coi').value||null,auto_renew:$('#c_auto').checked,coi_on_file:$('#c_coion').checked,previous_contract_id:$('#c_prev').value||null,kpis,doc_ref:$('#c_doc').value.trim()||null,notes:$('#c_notes').value.trim()||null,updated_at:new Date().toISOString()};if(!d.title)return toast('Title required');
 const r=id?await sb.from('contracts').update(d).eq('id',id).select().single():await sb.from('contracts').insert(d).select().single();if(r.error)return toast(r.error.message);toast('Saved');await refresh();go('contract-'+r.data.id)}
async function delContract(id){const {error}=await sb.from('contracts').delete().eq('id',id);if(error)return toast(error.message);await refresh();go('contracts')}
function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast('Copied')).catch(()=>toast('Select and copy the text manually'))}
function digestText(){const wk=addDays(-7);const closed=S.cards.filter(c=>isClosed(c)&&(c.closed_at||'')>=wk);const open=openCards();return`Winston 200 — Board digest ${fmtD(today())}\n\nDECIDED THIS WEEK\n${closed.map(c=>'• '+summaryText(c)).join('\n')||'• nothing'}\n\nSTILL OPEN\n${open.map(c=>{const p=prog(c.id);return`• ${c.title} — by ${fmtD(c.deadline)} — waiting on ${p.waiting_ids.map(nameOf).join(', ')||'nobody'}`}).join('\n')||'• nothing'}\n\nON NEXT AGENDA\n${S.cards.filter(c=>c.status!=='draft'&&(c.needs_open_meeting||c.result==='NOT DECIDED')).map(c=>'• '+c.title).join('\n')||'• nothing'}`}
function exportCSV(){const rows=[['Title','Kind','Status','Result','Deadline','Cost','Needs open meeting','Closed','Votes']];for(const c of S.cards.filter(c=>c.status!=='draft')){const vs=S.votes.filter(v=>v.card_id===c.id);rows.push([c.title,c.kind,c.status,c.result||'',c.deadline||'',c.cost_text||'',c.needs_open_meeting?'yes':'no',c.closed_at||'',vs.map(v=>`${nameOf(v.person_id)}: ${v.choice} — ${v.reason}`).join(' | ')])}
 const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=`winston200-decisions-${today()}.csv`;a.click()}

boot();
</script>
</body>
