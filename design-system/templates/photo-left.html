<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>the brand — Photo-left + text-right</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: #0a0a14; color: var(--brand-title); }
  .stage { position: fixed; inset: 0; overflow: hidden; }
  .slide-canvas {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--scale, 1));
    transform-origin: center center; overflow: hidden;
    background: #fff;
  }
  .gradient-text {
    background: var(--brand-gradient);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .photo-slot {
    background: #cbd5e1 repeating-linear-gradient(135deg, transparent 0 14px, rgba(255,255,255,0.4) 14px 15px);
    display:flex; align-items:center; justify-content:center;
    font: 700 14px/1 'Open Sans', Arial, sans-serif;
    letter-spacing:0.22em; text-transform:uppercase; color:#4b6075;
  }
</style>
</head>
<body>
<!-- LAYOUT: photo-left — see LAYOUT_PATTERNS.md §6 -->
<div class="stage">
  <section class="slide-canvas" style="background:#fafbfc;" data-screen-label="Photo-left + text-right">
    <!-- Photo slot, left edge bleed -->
    <div class="photo-slot"
         style="position:absolute; left:0; top:0; width:880px; height:1080px;">
      DROP PHOTO 880×1080
    </div>

    <!-- Pill accents bleeding across the seam (single color family — all blue) -->
    <div style="position:absolute; left:760px; top:120px;
                width:200px; height:46px; border-radius:9999px;
                background:#00d2ff; opacity:0.85;"></div>
    <div style="position:absolute; left:700px; top:300px;
                width:170px; height:42px; border-radius:9999px;
                background:#2a6fff; opacity:0.9;"></div>
    <div style="position:absolute; left:740px; top:880px;
                width:220px; height:46px; border-radius:9999px;
                background:#0050f0; opacity:0.9;"></div>

    <img src="../assets/logo.svg" alt="" style="position:absolute; top:60px; right:64px; height:54px;">

    <!-- Right text block -->
    <div style="position:absolute; left:980px; top:300px; width:820px;">
      <div style="font: 800 104px/0.96 'Open Sans', Arial, sans-serif;
                  letter-spacing:-0.03em; color:var(--brand-title);">
        The<br><span class="gradient-text">Problem</span>
      </div>
      <p style="margin-top:34px; width:760px; margin-bottom:0;
                font: 600 34px/1.35 'Open Sans', Arial, sans-serif;
                color: var(--brand-title);">
        A counterparty's credit shifts in real time.
      </p>
      <p style="margin-top:26px; width:760px;
                font: 400 21px/1.65 'Open Sans', Arial, sans-serif;
                color: var(--brand-body);">
        Static annual reports lag the truth by 9–12 months. the brand's monitoring runs continuously
        across the network, surfacing material changes within hours of occurrence.
      </p>
    </div>
  </section>
</div>

<script>
  function scaleSlide() {
    const c = document.querySelector('.slide-canvas');
    if (!c) return;
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    c.style.setProperty('--scale', s);
  }
  window.addEventListener('resize', scaleSlide);
  window.addEventListener('load', scaleSlide);
  scaleSlide();
</script>
</body>
</html>
