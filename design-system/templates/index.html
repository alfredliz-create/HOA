<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>the brand — Index</title>
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; background: #0a0a14; color: var(--brand-title); }
  .stage { position: fixed; inset: 0; overflow: hidden; }
  .slide-canvas {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--scale, 1));
    transform-origin: center center; overflow: hidden;
    background: #fff;
  }
  .gradient-text {
    background: var(--brand-gradient);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .photo-slot {
    background: #cbd5e1 repeating-linear-gradient(135deg, transparent 0 14px, rgba(255,255,255,0.4) 14px 15px);
    display:flex; align-items:center; justify-content:center;
    font: 700 14px/1 'Open Sans', Arial, sans-serif;
    letter-spacing:0.22em; text-transform:uppercase; color:#4b6075;
  }
</style>
</head>
<body>
<!-- LAYOUT: index — see LAYOUT_PATTERNS.md §3 -->
<style>
  .outline-list { list-style:none; margin:0; padding:0; }
  .outline-list li {
    display:flex; align-items:center; gap:36px;
    padding:30px 0; border-bottom:1px solid rgba(0,0,0,0.10);
    font: 500 46px/1 'Open Sans', Arial, sans-serif;
    color: var(--brand-title);
  }
  .outline-list .n {
    width:56px; height:56px; flex:none; border-radius:50%;
    background: var(--brand-gradient); color:#fff;
    display:inline-flex; align-items:center; justify-content:center;
    font: 800 26px/1 'Open Sans', Arial, sans-serif;
  }
</style>
<div class="stage">
  <section class="slide-canvas" style="background:#fafbfc;" data-screen-label="Index">
    <img src="../assets/logo.svg" alt="" style="position:absolute; top:60px; right:64px; height:54px;">

    <div style="position:absolute; top:130px; left:135px; width:1200px;">
      <div style="font: 800 72px/1 'Open Sans', Arial, sans-serif;
                  letter-spacing:-0.02em; color:var(--brand-title);">
        Outline <span class="gradient-text">Presentation</span>
      </div>
      <p style="margin-top:16px; width:760px;
                font: 400 22px/1.6 'Open Sans', Arial, sans-serif;
                color: var(--brand-body);">
        Four sections covering the platform, the data, our regional advantage, and what's next.
      </p>
    </div>

    <ul class="outline-list" style="position:absolute; top:430px; left:135px; width:1120px;">
      <li><span class="n">1</span> Glimpse of the platform</li>
      <li><span class="n">2</span> Building the regional market</li>
      <li><span class="n">3</span> What makes us special</li>
      <li><span class="n">4</span> 2026 roadmap</li>
    </ul>
  </section>
</div>

<script>
  function scaleSlide() {
    const c = document.querySelector('.slide-canvas');
    if (!c) return;
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    c.style.setProperty('--scale', s);
  }
  window.addEventListener('resize', scaleSlide);
  window.addEventListener('load', scaleSlide);
  scaleSlide();
</script>
</body>
</html>
